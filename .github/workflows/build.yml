name: Build AURA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon 2>&1 | tee full.log

      - name: Ecrire le rapport dans le depot
        if: always()
        run: |
          echo "===== ERREURS KOTLIN =====" > ERREUR.txt
          grep -E "^e: |error:" full.log | head -n 25 >> ERREUR.txt || true
          echo "" >> ERREUR.txt
          echo "===== 40 DERNIERES LIGNES =====" >> ERREUR.txt
          tail -n 40 full.log >> ERREUR.txt
          git config user.name "aura-bot"
          git config user.email "bot@aura.local"
          git add -f ERREUR.txt
          git commit -m "rapport erreur" || true
          git push || true

      - name: Publier l APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
