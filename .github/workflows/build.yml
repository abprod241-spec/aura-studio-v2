name: Build AURA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        continue-on-error: true
        run: |
          touch full.log
          gradle assembleDebug --no-daemon 2>&1 | tee full.log || true

      - name: Rapport
        if: always()
        run: |
          touch full.log
          echo "=== RESULTAT ===" > ERREUR.txt
          grep -E "BUILD SUCCESSFUL|BUILD FAILED" full.log | head -n 3 >> ERREUR.txt || true
          echo "" >> ERREUR.txt
          echo "=== ERREURS KOTLIN ===" >> ERREUR.txt
          grep -E "^e: " full.log | head -n 20 >> ERREUR.txt || true
          echo "" >> ERREUR.txt
          echo "=== CAUSE ===" >> ERREUR.txt
          grep -A 10 "What went wrong" full.log | head -n 15 >> ERREUR.txt || true
          git config user.name "aura-bot"
          git config user.email "bot@aura.local"
          git add -f ERREUR.txt
          git commit -m "rapport" || true
          git push || true

      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
